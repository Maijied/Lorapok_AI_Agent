# Lorapok AI Agent — Continuous Integration
# Runs the Jest suite across supported Node/OS targets and verifies the Docker image builds.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "Docs/**"
      - "apps/website/**"
      - ".agents/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  FORCE_COLOR: "1"

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["18", "20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure Git identity (required by GitManager tests)
        run: |
          git config --global user.name "Lorapok CI Bot"
          git config --global user.email "bot@lorapok.tech"

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

  docker-build:
    name: Docker build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t lorapok-ai-agent:ci-${{ github.sha }} .

      - name: Smoke-check image
        run: |
          docker run --rm lorapok-ai-agent:ci-${{ github.sha }} node -e "console.log(require('./package.json').name)"
