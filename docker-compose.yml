services:
  lorapok:
    build: .
    container_name: lorapok-ai-agent
    restart: unless-stopped
    ports:
      - "3847:3847"
    environment:
      - NODE_ENV=development
      - PORT=3847
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - LORAPOK_DOCKER=true
      - PROJECT_ROOT=${PROJECT_ROOT}
    volumes:
      - .:/app
      - /app/node_modules
      - lorapok-config:/root/.lorapok
      - ${PROJECT_ROOT:-.}:/project
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3847/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    dns:
      - 8.8.8.8
      - 8.8.4.4

volumes:
  lorapok-config:
    name: lorapok-config
