<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐛 Lorapok | AI Coding Agent v1.0.1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14;
            --surface: #161b22;
            --border: #30363d;
            --primary: #00ffca;
            --secondary: #00bcd4;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-glow: rgba(0, 255, 202, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 0% 0%, rgba(0, 255, 202, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(0, 188, 212, 0.05) 0%, transparent 50%);
        }

        .container {
            max-width: 1000px;
            width: 90%;
            margin: 40px auto;
            animation: fadeIn 0.8s ease-out;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .subtitle {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-dim);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .card {
            background: rgba(22, 27, 34, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .input-group {
            position: relative;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            background: rgba(13, 17, 23, 0.8);
            border: 1px solid var(--border);
            padding: 18px 24px;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .button-row {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
        }

        button {
            flex: 1;
            padding: 15px 25px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s transform;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: var(--primary);
            color: #000;
        }

        .btn-secondary {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 0 5px 15px var(--accent-glow);
        }

        button:active {
            transform: translateY(0);
        }

        #output {
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            min-height: 200px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #d1d5db;
            white-space: pre-wrap;
            position: relative;
        }

        #output::before {
            content: 'TERMINAL OUTPUT';
            position: absolute;
            top: -10px;
            left: 20px;
            background: var(--bg);
            padding: 0 10px;
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 10px var(--primary);
            animation: pulse 2s infinite;
        }

        footer {
            margin-top: auto;
            padding: 40px;
            color: var(--text-dim);
            font-size: 0.8rem;
        }

        a {
            color: var(--primary);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.2);
                opacity: 0.7;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .loading-text {
            color: var(--primary);
            display: flex;
            align-items: center;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 1.2em;
            background: var(--primary);
            margin-left: 5px;
            animation: blink 1s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>🐛 Lorapok</h1>
            <div class="subtitle">Multi-Agent AI Coding Framework v1.0.1</div>
        </header>

        <main class="card">
            <div class="input-group">
                <input id="query" type="text" placeholder="Ask Lorapok anything... (e.g. 'Build a secure API')" />
            </div>

            <div class="button-row">
                <button onclick="runAgent('single')" class="btn-primary">
                    <span>🤖</span> Execute Single Agent
                </button>
                <button onclick="runAgent('multi')" class="btn-secondary">
                    <span>🔗</span> Collaborative Multi-Agent
                </button>
            </div>

            <div id="output">Waiting for command...</div>
        </main>

        <div style="margin-top: 30px; text-align: center; font-family: 'JetBrains Mono'; font-size: 0.8rem;">
            <p>
                <span class="status-dot"></span>
                Server Status: <a href="/health" target="_blank">Online</a> |
                Model: 20B+ Parameters
            </p>
        </div>
    </div>

    <footer>
        &copy; 2026 Lorapok AI. Powered by Advanced Agentic Logic.
    </footer>

    <script>
        async function runAgent(type) {
            const queryInput = document.getElementById('query');
            const query = queryInput.value.trim() || 'Explain Lorapok architecture';
            const output = document.getElementById('output');

            output.innerHTML = '<div class="loading-text">🤖 AGENT DISPATCHED: Thinking...<span class="cursor"></span></div>';

            try {
                // Use the bridge routes we added for the UI
                const endpoint = `/agent/${type}`;

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: query
                    })
                });

                const data = await response.json();

                if (data.success) {
                    output.textContent = data.content || 'Operation completed with no content output.';
                } else {
                    output.innerHTML = `<span style="color: #ff7b72;">❌ Error: ${data.error || 'Unknown failure'}</span>`;
                }
            } catch (err) {
                output.innerHTML = `<span style="color: #ff7b72;">❌ Connection Failed: ${err.message}</span>`;
            }
        }

        // Add Enter key support
        document.getElementById('query').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') runAgent('single');
        });
    </script>
</body>

</html>
